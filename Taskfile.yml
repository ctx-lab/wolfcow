version: '3'

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build wolfcow and its complete Apple Silicon macOS runtime
    cmds:
      - task: runtime
      - task: cli

  cli:
    desc: Build only the Go CLI
    cmds:
      - mkdir -p bin
      - go build -o bin/wolfcow ./cmd/wolfcow

  runtime:
    aliases: [native]
    desc: Build the bundled libkrun runtime and default Linux image
    cmds:
      - sh hack/build-runtime.sh

  package:
    desc: Package the CLI and runtime as one macOS archive
    cmds:
      - task: build
      - mkdir -p dist
      - tar -czf dist/wolfcow-0.0.1-darwin-arm64.tar.gz -C bin wolfcow runtime
      - cd dist && shasum -a 256 wolfcow-0.0.1-darwin-arm64.tar.gz > wolfcow-0.0.1-darwin-arm64.tar.gz.sha256

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  verify:
    desc: Run tests, Go vet, and static guest cross-build
    cmds:
      - task: test
      - go vet ./...
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/wolfcow-guest ./cmd/wolfcow-guest

  stage:a:
    desc: Boot the libkrun guest and run one bounded command over vsock
    cmds:
      - task: build
      - ./bin/wolfcow spike exec -- /bin/uname -r

  image:smoke:
    desc: Boot the pinned minimal image and check its shell and CA bundle
    cmds:
      - task: build
      - ./bin/wolfcow spike exec -- /bin/sh -c 'test -x /bin/busybox && test -r /etc/ssl/cert.pem && /bin/busybox echo "image smoke passed"'

  net:link:
    desc: Probe the virtio-net link and deny direct guest egress
    cmds:
      - task: build
      - ./bin/wolfcow spike net

  net:external:
    desc: Probe one explicitly allowed external TCP endpoint on physical macOS
    cmds:
      - task: build
      - sh hack/check-net-external.sh

  stage:b:
    desc: Run Stage B smoke and protocol conformance checks on macOS libkrun
    cmds:
      - task: build
      - sh hack/check-stage-b.sh
      - ./bin/wolfcow spike conformance examples/stage-b

  security:app-sandbox:
    desc: Probe App Sandbox signing and private-file denial (experimental)
    cmds:
      - sh hack/check-app-sandbox.sh
