name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/wolfcow ./cmd/wolfcow
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/wolfcow-guest ./cmd/wolfcow-guest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - name: Scan Git history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact .
